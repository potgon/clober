name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - id: sidecar
        shell: bash
        run: echo "exists=$([ -f sidecar-audio/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.sidecar.outputs.exists == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.sidecar.outputs.exists == 'true'
        working-directory: sidecar-audio
        shell: bash
        run: |
          uv sync --locked
          uv run ruff check
          uv run ruff format --check
          uv run pytest
